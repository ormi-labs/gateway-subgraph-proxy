[package]
name = "proxy"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.9"
clap = { version = "4.6.1", features = ["derive", "env"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
tokio = { version = "1.52.3", features = ["rt-multi-thread", "fs"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
reqwest = { version = "0.13.4", features = ["json"] }
futures = "0.3.32"
tower-http = { version = "0.7.0", features = ["trace"] }
humantime = "2.4.0"

# Max optimization for release
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
